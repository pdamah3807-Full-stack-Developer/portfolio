<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Planner | Peter Damah</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for professional icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i> Peter | Developer & Academia
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="planner.html" class="active">Academic Planner</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="planner-wrapper">
        <div class="container">

            <section class="card calendar-card">
                <div class="calendar-header">
                    <h2><i class="fa-regular fa-calendar-days"></i> Academic Schedule</h2>
                    <h3 id="monthYearDisplay"></h3>
                </div>
                <div id="calendarDays" class="calendar-days"></div>
            </section>

            <section class="card task-section">
                <div class="task-header">
                    <h2 id="selectedDateTitle">Select a Date</h2>
                    <p class="subtitle">Manage assignments, lectures, and exams efficiently.</p>
                </div>

                <div class="form-group">
                    <label for="scheduleDate">Select Date</label>
                    <input type="date" id="scheduleDate" class="form-control">
                </div>

                <div class="form-group">
                    <label for="scheduleTime">Select Time</label>
                    <input type="time" id="scheduleTime" class="form-control">
                </div>

                <div class="form-group">
                    <label for="activityCategory">Activity Type</label>
                    <select id="activityCategory" class="form-control">
                        <option value="Live Lecture">Live Lecture</option>
                        <option value="Ungraded Assessment">Ungraded Assessment</option>
                        <option value="Graded Assessment">Graded Assessment</option>
                        <option value="Examination">Examination</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="taskInput">Activity Description</label>
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="form-control"
                        placeholder="e.g., COS102 Assignment, GST Quiz">
                </div>

                <button id="addTaskButton" class="btn primary-btn">
                    <i class="fa-solid fa-plus"></i> Add Schedule
                </button>

                <div class="task-list-container">
                    <h3 id="listHeading">Scheduled Items</h3>
                    <ul id="taskList" class="task-list"></ul>
                </div>
            </section>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 Peter Yohanna Damah | MIVA Open University.All right reserved!</p>
    </footer>

    <script src="planner.js"></script>
</body>
</html>
